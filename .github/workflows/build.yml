name: Build ps4-stream Payloads

on:
  push:
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bash build-essential clang-18 lld-18 llvm-18 git wget unzip

      - name: Populate PBS-Payload src directory
        run: |
          if [ ! -d "src/common" ]; then
            git clone --depth 1 https://github.com/seregonwar/PBS-Payload.git _pbs
            mkdir -p src
            cp -r _pbs/payload/src/* src/
            rm -rf src/platform/ps5 _pbs
          fi

      - name: Build payloads
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload ps4-stream artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ps4-stream-elf
          path: |
            ps4-stream-720p.elf
            ps4-stream-1080p.elf
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="Low-latency 720p60 / 1080p60 hardware H.264 MPEG-TS live streamer payloads for jailbroken PS4. Stream via http://<PS4_IP>:5900/stream.ts and shut down via TCP port 5901."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete-asset "$TAG" ps4-stream-720p.elf -y || true
            gh release delete-asset "$TAG" ps4-stream-1080p.elf -y || true
            gh release edit "$TAG" --draft=false --title "ps4-stream $TAG" --notes "$NOTES"
            gh release upload "$TAG" ps4-stream-720p.elf ps4-stream-1080p.elf
          else
            gh release create "$TAG" ps4-stream-720p.elf ps4-stream-1080p.elf --title "ps4-stream $TAG" --notes "$NOTES"
          fi
