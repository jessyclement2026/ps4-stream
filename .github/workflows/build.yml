name: Build ps4-stream Payloads

on:
  push:
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bash \
            build-essential \
            clang-18 \
            lld-18 \
            llvm-18 \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            meson \
            socat \
            git \
            wget \
            unzip \
            python3

      - name: Download ps4-payload-sdk
        run: |
          wget -q https://github.com/ps4-payload-dev/sdk/releases/latest/download/ps4-payload-sdk.zip
          unzip -oq ps4-payload-sdk.zip

      - name: Build payload
        env:
          PS4SDK: ${{ github.workspace }}/ps4-payload-sdk
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload ps4-stream artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ps4-stream-elf
          path: |
            ps4-stream-720p.elf
            ps4-stream-1080p.elf
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ps4-stream Payloads ${{ github.ref_name }}
          files: |
            ps4-stream-720p.elf
            ps4-stream-1080p.elf
          generate_release_notes: true
          body: |
            ## Ultra-Low-Latency Hardware H.264 Live Streamer (`ps4-stream`)

            Ultra-low-latency **720p60 / 1080p60 hardware H.264 live streamer** for jailbroken PlayStation 4 consoles, wrapped in standard **188-byte MPEG-TS (`video/mp2t`)** over `TCP_NODELAY`.

            ### Included Payloads
            - **`ps4-stream-720p.elf`** — `720p @ 60 fps` (PS4 Base / Slim)
            - **`ps4-stream-1080p.elf`** — `1080p @ 60 fps` (PS4 Pro)

            ### Key Features
            - **Hardware H.264 Capture:** Uses the PS4's built-in `libSceAvcap` hardware encoder (`720p60` on Base/Slim PS4; `1080p60` on PS4 Pro).
            - **Standard MPEG-TS over HTTP & Raw TCP (`Port 5900`):** Auto-detects HTTP (`http://<PS4_IP>:5900/stream.ts`) and raw TCP (`tcp://<PS4_IP>:5900`) on the same port.
            - **Near-Zero Latency:** Built with `TCP_NODELAY`, real wall-clock 90 kHz PCR/PTS timestamps, and zero transcoding on the PS4 (~20–40 ms latency).
            - **Fresh-Boot Safe & Graceful Shutdown (`Port 5901`):** Waits for `SceRemotePlay` after boot and cleanly releases `Avcap` via TCP port `5901`.

            ### Quick Start
            1. **Send Payload:** Enable **GoldHEN** (with BinLoader enabled on port `9021`), then send the binary matching your console:
               ```bash
               # PS4 Base / Slim (720p60)
               socat -t 99999999 - TCP:<PS4_IP>:9021 < ps4-stream-720p.elf

               # PS4 Pro (1080p60)
               socat -t 99999999 - TCP:<PS4_IP>:9021 < ps4-stream-1080p.elf
               ```
            2. **Watch Live (Lowest Latency with `mpv`):**
               ```bash
               mpv --profile=low-latency --untimed --no-cache http://<PS4_IP>:5900/stream.ts
               ```
            3. **Stop Cleanly:**
               ```bash
               nc -zv <PS4_IP> 5901
               ```
